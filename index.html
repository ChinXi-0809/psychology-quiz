<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>心理學隨機刷題</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#242936;background:#f4f6fb}
*{box-sizing:border-box}body{margin:0;padding:24px 14px}.wrap{max-width:820px;margin:auto}
header,.panel,.question,.result{background:#fff;border:1px solid #e5e8f0;border-radius:18px;padding:20px;margin-bottom:15px;box-shadow:0 4px 18px #202b4410}
h1{font-size:28px;margin:8px 0}h2{font-size:20px;margin:8px 0 14px}.muted{color:#70798b;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat{background:#f1f3f8;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:24px}
.progress{height:9px;background:#e9edf4;border-radius:20px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;width:0;background:#5267bd;transition:.2s}
.question h3{font-size:16px;line-height:1.65;margin:0 0 14px}.option{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid #e6e9f0;border-radius:11px;margin:8px 0;cursor:pointer}.option:has(input:checked){border-color:#6578c7;background:#f3f5ff}.option input{margin-top:4px;accent-color:#5267bd}
button{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer;background:#5267bd;color:white}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#e9edf8;color:#34416f}.actions{display:flex;gap:10px;flex-wrap:wrap}.score{font-size:34px;font-weight:800}.correct{border-color:#8ac7a2;background:#f1fbf4}.wrong{border-color:#e5a0a0;background:#fff5f5}.answer{font-size:14px;margin-top:8px}.tag{display:inline-block;background:#edf0fa;color:#5267bd;border-radius:30px;padding:5px 10px;font-size:12px}
@media(max-width:520px){body{padding:12px 9px}header,.panel,.question,.result{padding:15px}h1{font-size:24px}.stats{gap:6px}.stat{padding:9px 4px}}
</style>
</head>
<body><main class="wrap">
<header>
<span class="tag">心理學題庫・隨機練習</span><h1>心理學刷題測驗</h1>
<div class="muted">每次從完整 50 題中隨機抽出選擇題 10 題、是非題 10 題。可用手機或電腦作答。</div>
<div class="stats"><div class="stat"><b>10</b><span class="muted">選擇題</span></div><div class="stat"><b>10</b><span class="muted">是非題</span></div><div class="stat"><b>100</b><span class="muted">滿分</span></div></div>
</header>
<section class="panel"><div style="display:flex;justify-content:space-between;gap:10px"><b>作答進度</b><span id="progressText" class="muted">0 / 20 題</span></div><div class="progress"><div id="bar" class="bar"></div></div><div class="muted">完成全部 20 題後即可交卷。</div></section>
<div id="quiz"></div>
<div class="actions" id="submitArea"><button id="submit" disabled>交卷並查看成績</button></div>
<div id="results"></div>
</main>
<script>
const C = [
["心理學最早主要隸屬於哪一個學科領域，後來逐漸發展成為一門獨立的科學？",["社會學","哲學","經濟學","政治學"],1],
["哪一位學者被稱為「實驗心理學之父」，並於 1879 年在德國萊比錫大學建立第一個心理學實驗室？",["Sigmund Freud（佛洛伊德）","William James（詹姆斯）","Wilhelm Wundt（馮特）","Erik Erikson（艾瑞克森）"],2],
["人本主義心理學強調人的潛能、自我成長與自我實現，下列哪兩位學者最具代表性？",["佛洛伊德與榮格","馮特與詹姆斯","馬斯洛與羅傑斯","皮亞傑與艾瑞克森"],2],
["佛洛伊德將人的心理活動分為意識、前意識與潛意識。哪個例子最符合「潛意識」？",["正在思考今天中午要吃什麼","記得昨天上課的內容","自己無法察覺，卻持續影響行為的內在欲望與衝突","正在閱讀老師提供的教材"],2],
["正在考慮晚餐要吃什麼，並清楚知道自己正在思考這件事，屬於哪一種意識狀態？",["意識","前意識","潛意識","無意識衝動"],0],
["佛洛伊德的人格結構中，Id（本我）主要遵循哪一種原則？",["現實原則","道德原則","快樂原則","社會原則"],2],
["大學生很想立即購買喜歡的商品，但想到生活費有限，因此決定先存錢。這代表人格結構中的哪一部分？",["本我（Id）","自我（Ego）","超我（Superego）","潛意識（Unconscious）"],1],
["學生考試時很想抄襲，但想到違反誠信原則，因此決定不作弊。這反映哪一種人格結構？",["本我（Id）","自我（Ego）","超我（Superego）","前意識（Preconscious）"],2],
["學生考試不及格，卻告訴自己：「這次考試太簡單了，根本沒有鑑別度。」這是哪一種防衛機制？",["否認","合理化","投射","退化"],1],
["學生明明很嫉妒同學的好成績，卻一直認為「那個同學一定很嫉妒我」。這是哪一種防衛機制？",["投射","壓抑","升華","否認"],0],
["學生遭遇感情挫折後，將情緒轉化為運動及創作的動力。這是哪一種防衛機制？",["退化","否認","升華","投射"],2],
["學生在學校受到老師責備，回到宿舍後卻對室友發脾氣。這是哪一種防衛機制？",["投射","轉移","升華","合理化"],1],
["Erik Erikson 的第一個階段「信任對不信任」發生在哪個時期？",["嬰兒期","青少年期","成年期","老年期"],0],
["幼兒開始嘗試自己穿衣服、吃飯及做選擇，父母適度鼓勵與支持。符合 Erikson 哪個發展階段？",["信任對不信任","自主對羞愧與懷疑","勤奮對自卑","自我認同對角色混淆"],1],
["大學生開始思考「我是誰？我未來想成為什麼樣的人？適合什麼工作？」符合哪個發展階段？",["自主對羞愧與懷疑","自我認同對角色混淆","生產對停滯","親密對孤立"],1],
["中年人積極投入社會服務、培養下一代，希望對社會有所貢獻。符合哪個發展階段？",["親密對孤立","勤奮對自卑","生產對停滯","自我統整對絕望"],2],
["人格特質理論主要認為人格具有什麼特性？",["人格完全由潛意識決定","人格是相對穩定且具有個別差異的特質組合","人格每天都會完全改變","人格只受到家庭教育影響"],1],
["學生個性活潑、喜歡交朋友、樂於參加社團活動，也享受與他人互動。五大人格中較高的特質是？",["神經質","嚴謹性","外向性","開放性"],2],
["學生做事有計畫，提前準備考試、準時繳交作業，也重視承諾。五大人格中較高的特質是？",["嚴謹性","外向性","神經質","親和性"],0],
["依附理論（Attachment Theory）主要由哪位學者提出？其主要觀點為何？",["Freud，強調本能與潛意識","John Bowlby，強調人與重要他人之間的情感連結","Erik Erikson，強調心理社會發展","Maslow，強調自我實現"],1],
["依附關係中的「安全基地」（Secure Base）是什麼意思？",["孩子必須一直待在照顧者身邊","照顧者提供安全感，使孩子有信心探索環境，需要時再回來尋求支持","孩子不需要任何照顧者的協助","只要物質生活獲得滿足，就能建立安全感"],1],
["Ainsworth 設計的「陌生情境實驗」，主要透過什麼方式觀察嬰兒的依附關係？",["觀察嬰兒的智力與語言能力","觀察嬰兒與母親分離及重新團聚時的反應","測量嬰兒的身高與體重","觀察嬰兒是否能獨立完成遊戲"],1],
["嬰兒在母親離開時感到不安，母親回來時主動靠近，安撫後逐漸平靜，之後繼續探索環境。屬於哪種依附？",["安全型依附","焦慮型依附","逃避型依附","混亂型依附"],0],
["學生在親密關係中經常擔心對方不愛自己，反覆確認對方是否在乎，也容易因訊息未讀而焦慮。接近哪種依附？",["安全型依附","焦慮型依附","逃避型依附","混亂型依附"],1],
["依附理論中的「內在工作模型」（Internal Working Models）主要是指什麼？",["個人對學校課業及工作的安排計畫","個人對自己及他人關係所形成的內在期待與互動模式","個人天生具有的智力能力","個人對未來職業選擇的標準"],1]
];
const T = [
["心理學最初與哲學有密切關係，後來透過實驗與科學研究，發展成為一門獨立的學科。",true],
["1879 年，佛洛伊德在德國萊比錫大學建立了第一個心理學實驗室。",false],
["行為主義心理學主要關注人類可以觀察與測量的行為，並重視環境與學習對行為的影響。",true],
["佛洛伊德將心理活動分為意識、前意識與潛意識三個層次。",true],
["意識是指個人目前能夠察覺到的心理活動，例如正在思考、閱讀或說話。",true],
["前意識是指個人永遠無法回想，也完全無法察覺的心理內容。",false],
["本我（Id）遵循快樂原則，追求立即滿足需求與欲望。",true],
["超我（Superego）代表內在的道德標準、良心及理想要求。",true],
["心理防衛機制是個人面對焦慮、衝突或壓力時，可能使用的心理保護方式，通常具有減輕心理不安的功能。",true],
["合理化是指個人將自己不容易接受的行為或結果，透過看似合理的理由加以解釋。",true],
["投射是指個人將自己不容易接受的想法或情緒，歸因到其他人身上。",true],
["升華是指將不容易被社會接受的衝動，轉化成較具建設性或社會可接受的活動。",true],
["Erikson 認為人格發展只發生在兒童時期，成年後人格就不再改變。",false],
["嬰兒期的主要發展任務是建立信任感，如果照顧者能提供穩定且適當的照顧，有助於嬰兒建立對他人的信任。",true],
["自主對羞愧與懷疑的發展階段，主要是兒童開始學習獨立、自己做決定及嘗試完成事情。",true],
["青少年期的主要心理社會發展任務是生產對停滯，重點在於照顧下一代。",false],
["人格特質理論認為，每個人的人格都完全相同，不存在個別差異。",false],
["五大人格特質包括外向性、親和性、嚴謹性、神經質及開放性。",true],
["外向性較高的人通常比較喜歡社交活動、與他人互動，並且較容易從社交情境中獲得能量。",true],
["Bowlby 認為，依附是人與重要他人之間持續存在的情感連結，能夠提供安全感與支持。",true],
["依附關係只存在於親子關係中，不可能發生在朋友、伴侶、老師或其他重要他人之間。",false],
["安全型依附的孩子能將主要照顧者視為安全基地，在獲得安全感後，較能放心探索周遭環境。",true],
["在陌生情境實驗中，逃避型依附的嬰兒通常會在母親離開時表現出強烈焦慮，母親回來後則會持續尋求接觸並難以安撫。",false],
["焦慮型依附者在親密關係中可能害怕被拋棄，經常需要確認對方是否在乎自己。",true],
["早期依附經驗會影響個人後來的人際互動，但透過後續穩定、支持及修復性的關係經驗，仍有機會逐漸建立安全感。",true]
];
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
let questions=[],answers={},submitted=false;
function start(){questions=[...shuffle(C.map((x,i)=>({type:"c",id:i,q:x[0],opts:x[1],a:x[2]})).slice(0,25)).slice(0,10),...shuffle(T.map((x,i)=>({type:"t",id:i,q:x[0],a:x[1]}))).slice(0,10)];answers={};submitted=false;render();}
function render(){
const quiz=document.getElementById("quiz");quiz.innerHTML="";
questions.forEach((q,i)=>{
const card=document.createElement("section");card.className="question";card.id="q"+i;
let options=q.type==="c"?q.opts.map((o,j)=>({v:String(j),label:"ABCDEFGHIJKLMNOPQRSTUVWXYZ"[j]+". "+o})): [{v:"true",label:"○ 正確"},{v:"false",label:"✕ 錯誤"}];
card.innerHTML=`<div class="muted">${q.type==="c"?"選擇題":"是非題"}・第 ${q.type==="c"?questions.slice(0,i+1).filter(x=>x.type==="c").length:questions.slice(0,i+1).filter(x=>x.type==="t").length} 題</div><h3>${q.q}</h3><div class="opts"></div>`;
const opts=card.querySelector(".opts");
options.forEach(o=>{const label=document.createElement("label");label.className="option";label.innerHTML=`<input type="radio" name="q${i}" value="${o.v}"><span>${o.label}</span>`;label.querySelector("input").addEventListener("change",e=>{answers[i]=e.target.value;updateProgress()});opts.append(label)});
quiz.append(card);
});
document.getElementById("results").innerHTML="";document.getElementById("submitArea").style.display="flex";document.getElementById("submit").disabled=true;updateProgress();
}
function updateProgress(){let n=Object.keys(answers).length;document.getElementById("progressText").textContent=`${n} / 20 題`;document.getElementById("bar").style.width=(n/20*100)+"%";document.getElementById("submit").disabled=n!==20}
document.getElementById("submit").addEventListener("click",()=>{
submitted=true;let score=0,html="";questions.forEach((q,i)=>{let correct=q.type==="c"?String(q.a):String(q.a);let right=answers[i]===correct;if(right)score++;let your=q.type==="c"?(q.opts[Number(answers[i])]||"未作答"):(answers[i]==="true"?"○ 正確":"✕ 錯誤");let ans=q.type==="c"?`${"ABCDEFGHIJKLMNOPQRSTUVWXYZ"[q.a]}. ${q.opts[q.a]}`:(q.a?"○ 正確":"✕ 錯誤");html+=`<section class="question ${right?"correct":"wrong"}"><div style="display:flex;justify-content:space-between;gap:8px"><b>${q.type==="c"?"選擇題":"是非題"}・檢討</b><b>${right?"✓ 答對":"✕ 答錯"}</b></div><h3>${q.q}</h3><div class="answer">你的答案：${your}</div><div class="answer"><b>正確答案：${ans}</b></div></section>`});
document.getElementById("submitArea").style.display="none";
document.getElementById("results").innerHTML=`<section class="result"><div class="muted">本次測驗成績</div><div class="score">${score*5} 分</div><b>答對 ${score} 題／20 題</b><p class="muted">選擇題與是非題各 10 題，每題 5 分。</p><button id="again">重新隨機抽題</button></section><h2>錯題與答案檢討</h2>${html}`;
document.getElementById("again").addEventListener("click",start);window.scrollTo({top:0,behavior:"smooth"});
});
start();
</script></body></html>
